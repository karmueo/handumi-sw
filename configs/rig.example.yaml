# 默认单台 UMI 配置；本机序列号和标定保存在忽略版本管理的 local 目录。
recording:
  device: vive
  robot: rm75b
  side: right
  cameras: [right_wrist]
  fps: 30
cameras:
  right_wrist:
    type: opencv
    role: right
    index_or_path: /dev/v4l/by-path/REPLACE_WITH_CAMERA-video-index0
    width: 1920
    height: 1080
    fps: 30
    fourcc: MJPG
umi:
  calibration: configs/calibration/umi/local/calibration.yaml
  # 独立桌面会话；正式录制前必须完成求解和独立验证。
  session_calibration: configs/calibration/umi/local/session.yaml
