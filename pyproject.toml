[project]
name = "handumi"
version = "0.1.0"
description = "Robot-free bimanual demonstration recording and retargeting for HandUMI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "lerobot[feetech]==0.5.1",
    "huggingface-hub>=1.0.0,<2.0.0",
    "rerun-sdk>=0.24.0,<0.27.0",
    # Build tools for xrobotoolkit-sdk (CMake-based). Listed here so uv sync
    # tracks them in the lockfile and they are available when building the SDK.
    "cmake>=3.29",
    "pybind11>=2.13",
    "setuptools>=71",
    "python-dotenv==1.2.2",
    "pyyaml>=6.0",
    "opencv-python>=4.10,<5",
    # Axol IK solver (src/handumi/robots/axol/solver.py)
    "numpy>=2.0",
    "jax>=0.4.0",
    "jaxlie>=1.0.0",
    "jaxls @ git+https://github.com/brentyi/jaxls.git",
    "yourdfpy",
    "pyroki @ git+https://github.com/chungmin99/pyroki.git",
    "matplotlib>=3.11.0",
    "scipy>=1.17.1",
    # Offline voice control for hands-free recording (src/handumi/utils/voice.py).
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    # Terminal dashboard for recording status, controls, and timing.
    "rich>=13.9",
]

[project.urls]
Homepage = "https://github.com/murobotics-ai/handumi-hw"
Repository = "https://github.com/murobotics-ai/handumi-sw"
Issues = "https://github.com/murobotics-ai/handumi-sw/issues"

[project.optional-dependencies]
vive = ["openvr>=2.5,<3"]
piper = [
    "piper_sdk @ git+https://github.com/agilexrobotics/piper_sdk.git",
]
openarm = [
    "openarm_can @ git+https://github.com/enactic/openarm_can.git@1.2.9#subdirectory=python",
]
sim = [
    "viser>=1.0.0",
    "mujoco>=3.9.0",
    "pyvista>=0.43.0",
]
cuda = [
    "jax[cuda13]>=0.4.0",
]
# Context-camera inpainting (src/handumi/inpainting). Generation is billed per
# call, so this stays opt-in rather than part of the base install.
inpaint = [
    "google-genai>=2.20",
]

[project.scripts]
handumi = "handumi.scripts.cli:main"
hu = "handumi.scripts.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/handumi"]

[tool.hatch.build.targets.wheel.force-include]
"assets/arx5" = "handumi/assets/arx5"
"assets/axol" = "handumi/assets/axol"
"assets/metal" = "handumi/assets/metal"
"assets/openarm" = "handumi/assets/openarm"
"assets/piper" = "handumi/assets/piper"
"assets/rm75b" = "handumi/assets/rm75b"
"assets/franka_emika_panda" = "handumi/assets/franka_emika_panda"
"assets/r1lite" = "handumi/assets/r1lite"
"assets/scenes" = "handumi/assets/scenes"
"assets/trlc-dk1" = "handumi/assets/trlc-dk1"
"assets/yam" = "handumi/assets/yam"
"configs/quality.yaml" = "handumi/configs/quality.yaml"
"configs/rig.example.yaml" = "handumi/configs/rig.example.yaml"
"configs/rig.legacy.example.yaml" = "handumi/configs/rig.legacy.example.yaml"
"configs/robots" = "handumi/configs/robots"
"configs/inpainting-prompts" = "handumi/configs/inpainting-prompts"
# Include calibration pieces explicitly: lab-local measurements under
# configs/calibration/table/local/*.yaml are private and must never ship in a
# built artifact, so the table directory is not included wholesale.
"configs/calibration/controller_tcp" = "handumi/configs/calibration/controller_tcp"
"configs/calibration/table/sim" = "handumi/configs/calibration/table/sim"
"configs/calibration/table/README.md" = "handumi/configs/calibration/table/README.md"
"configs/calibration/table/local/README.md" = "handumi/configs/calibration/table/local/README.md"
"configs/calibration/table/local/example.yaml" = "handumi/configs/calibration/table/local/example.yaml"

[tool.hatch.build.targets.sdist]
exclude = ["configs/calibration/umi/local/**"]
include = [
    "src/handumi",
    "assets",
    "configs",
    "docs",
    "README.md",
    "LICENSE",
]

[tool.uv]
no-build-isolation-package = ["xrobotoolkit-sdk"]

[tool.basedpyright]
# "standard" catches real bugs (broken imports, missing attributes, type
# mismatches) without basedpyright's implicit "all" mode, whose reportUnknown*
# family flags every un-annotated numpy ndarray generic as noise.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["external_dependencies/XRoboToolkit-PC-Service-Pybind_X86_and_ARM64"]
reportMissingModuleSource = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Explicit selection so the editor, CLI, and CI all agree. Without this
# section ruff enables its full default rule set (~400 rules), which floods
# the editor with optional style warnings. E501 (line-too-long) is left out
# deliberately: the pre-existing codebase was not written to a hard column
# limit, and enforcing one now would touch hundreds of unrelated lines.
select = [
    "E4",      # import placement
    "E7",      # statement errors (comparison to None/True, etc.)
    "E9",      # syntax/io errors
    "F",       # pyflakes: undefined names, unused imports/variables
    "W",       # warnings: trailing whitespace, deprecated escapes
    "I",       # import sorting
    "UP",      # pyupgrade: modernize syntax for the 3.12 floor
    "RET501",  # no explicit `return None` when it is the only return
    "PLR1711", # no useless trailing `return`
    "TRY004",  # raise TypeError (not ValueError) for bad types
]

[tool.pytest.ini_options]
testpaths = ["tests"]
